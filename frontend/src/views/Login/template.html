<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="logo">VCL</h1>
            <p class="subtitle">Virtual Chemistry Lab</p>
            <h2>ログイン</h2>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" required placeholder="example@school.ed.jp">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="form-error" id="login-error"></div>

            <button type="submit" class="primary-btn login-btn">ログイン</button>
        </form>

        <div class="login-footer">
            <p>アカウントをお持ちでない場合は <a href="/register" data-link>新規登録</a></p>
        </div>
    </div>
</div>
