<div class="lab-scene">
    <div class="trophy-toast" popover="manual">
        <div class="trophy-toast-icon">🏆</div>
        <div class="trophy-toast-content">
            <span class="trophy-toast-title">トロフィー獲得！</span>
            <span class="trophy-toast-body"></span>
        </div>
    </div>

    <!-- Three.js Canvas Container -->
    <div id="three-canvas-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0;"></div>

    <!-- UIオーバーレイ -->
    <div class="lab-info-overlay">
        <div class="lab-info-box">
            <strong class="lab-title">実験中: <span id="lab-title-display">...</span></strong>
            <div class="lab-timer-area">経過時間: <span id="lab-timer">00:00</span></div>
            <div id="lab-instruction-box" style="margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 0.9rem; display: none;">
                <span style="color: #ff9a9e; font-weight: bold;">Mission:</span>
                <span id="lab-instruction-text" style="color: #fff;"></span>
            </div>
        </div>
    </div>

    <div class="lab-controls-overlay">
        <button id="btn-lab-periodic-table" class="secondary-btn">周期表</button> <!-- 追加 -->
        <button id="btn-lab-finish" class="primary-btn lab-btn-finish">実験終了</button>
    </div>

    <!-- 薬品セット先選択ダイアログ -->
    <div id="chemical-select-dialog" class="lab-modal-overlay" style="display: none;">
        <div class="lab-modal-content">
            <h3>薬品をセット</h3>
            <p><strong><span id="chemical-select-name"></span></strong> をどこに入れますか？</p>
            <div class="lab-modal-buttons">
                <button id="btn-set-testtube" class="modal-btn tube-btn">試験管 (Joy-Con L)</button>
                <button id="btn-set-flask" class="modal-btn flask-btn">フラスコ (Joy-Con R)</button>
            </div>
            <button id="btn-cancel-select" class="secondary-btn modal-cancel">× 閉じる</button>
        </div>
    </div>

    <!-- 下部ツールバー -->
    <div class="lab-toolbar" id="lab-toolbar">
        <!-- JSで動的にボタンを追加 -->
    </div>

    <!-- 解説ダイアログ -->
    <div id="lab-explanation-dialog" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); border: 2px solid #4CAF50; border-radius: 10px; padding: 20px; z-index: 2000; width: 80%; max-width: 600px; color: white; text-align: center; box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);">
        <h2 style="color: #4CAF50; margin-top: 0;">実験成功！</h2>
        <p id="lab-explanation-text" style="font-size: 1.2rem; line-height: 1.6; margin: 20px 0; text-align: left;"></p>
        <button id="btn-close-explanation" class="primary-btn" style="font-size: 1.2rem; padding: 10px 30px;">クエスト完了</button>
    </div>

        <!-- 周期表オーバーレイ -->
        <div id="periodic-table-overlay" class="periodic-table-overlay" style="display: none; background: rgba(0,0,0,0.9);">
            <button id="btn-close-periodic" class="close-btn" aria-label="閉じる">&times;</button>
            <div id="periodic-table-grid" class="periodic-table-container">
                <!-- JSでセル生成 -->
            </div>

            <template id="periodic-element-template">
                <div class="element-cell">
                    <div class="element-number"></div>
                    <div class="element-symbol"></div>
                    <div class="element-name"></div>
                </div>
            </template>

            <div class="element-info-panel">
                <div id="pt-info-symbol" class="info-symbol-large">H</div>
                <div class="info-details">
                    <div style="display: flex; align-items: baseline; gap: 10px;">
                        <span id="pt-info-name-jp" style="font-size: 2em; font-weight: bold;">水素</span>
                        <span id="pt-info-name-en" style="color: #888;">Hydrogen</span>
                        <span style="margin-left: auto;">原子番号: <span id="pt-info-number" style="color: cyan;">1</span></span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                        <div>原子量: <span id="pt-info-weight">1.008</span></div>
                        <div>融点: <span id="pt-info-mp">-</span></div>
                        <div>沸点: <span id="pt-info-bp">-</span></div>
                        <div>外観: <span id="pt-info-app">-</span></div>
                    </div>
                    <div id="pt-info-desc" style="margin-top: 10px; color: #ccc;">-</div>
                </div>
            </div>

            <div style="color: #888; margin-top: 10px; font-size: 0.9em;">
                Joy-Con: [Lスティック] 移動 / [A] 選択 / [B] 閉じる
            </div>
        </div>
    </div>
