<div class="register-card">
  <h2 class="register-title">新規登録</h2>
  <div class="input-group">
    <input type="text" placeholder="ユーザー名" class="input-field">
  </div>
  <div class="input-group">
    <input type="email" placeholder="メールアドレス" class="input-field">
  </div>
  <div class="input-group">
    <input type="password" placeholder="パスワード" class="input-field">
  </div>
  <button class="submit-btn">アカウントを作成</button>
  <div class="login-link">アカウントをお持ちですか？ <a href="#">ログイン</a></div>
</div>
