<div class="lab-scene">
    <!-- Three.js Canvas Container -->
    <div id="three-canvas-container" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0;"></div>

    <!-- UIオーバーレイ -->
    <div class="lab-info-overlay">
        <div class="lab-info-box">
            <strong class="lab-title">実験中: <span id="lab-title-display">...</span></strong>
            <div class="lab-timer-area">経過時間: <span id="lab-timer">00:00</span></div>
        </div>
    </div>

    <div class="lab-controls-overlay">
        <button id="btn-lab-abort" class="secondary-btn lab-btn-abort">中断して戻る</button>
        <button id="btn-lab-finish" class="primary-btn lab-btn-finish">実験終了</button>
    </div>

    <!-- 下部ツールバー -->
    <div class="lab-toolbar">
        <button class="secondary-btn">ビーカー</button>
        <button class="secondary-btn">フラスコ</button>
        <button class="secondary-btn">スポイト</button>
        <button class="secondary-btn">バーナー</button>
        <div class="lab-toolbar-separator"></div>
        <button class="primary-btn icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>実験ノート</span>
        </button>
    </div>
</div>
