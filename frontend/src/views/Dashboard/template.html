<div class="dashboard-container">
    <h1 class="dashboard-title">実験室へようこそ</h1>
    <p class="dashboard-subtitle">モードを選択して実験を開始してください</p>

    <div class="mode-card-container">
        <!-- Card 1: Tutorial -->
        <div class="mode-card card-green" id="card-tutorial">
            <div class="card-strip"></div>
            <div class="card-content">
                <div class="mode-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg></div>
                <h3>チュートリアル</h3>
                <p>VCLの基本操作を学ぶモード。<br>まずはここからスタートして操作に慣れましょう。</p>
            </div>
        </div>

        <!-- Card 2: Free Mode (Reordered to center) -->
        <div class="mode-card card-orange" id="card-free">
            <div class="card-strip"></div>
            <div class="card-content">
                <div class="mode-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31c0 .39-.155.765-.429 1.037L5 15v6h14v-6l-4.571-4.653A1.5 1.5 0 0 1 14 9.31V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg></div>
                <h3>フリーモード</h3>
                <p>器具と試薬を自由に組み合わせて実験できるサンドボックス。<br>様々な化学反応を発見しよう。</p>
            </div>
        </div>

        <!-- Card 3: Select Mode / Quest (Reordered to right) -->
        <div class="mode-card card-purple" id="card-select">
            <div class="card-strip"></div>
            <div class="card-content">
                <div class="mode-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 15 6-6"/><path d="m22 9-6 6"/><path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993"/><path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993"/><path d="m17 6-2.5-2.5"/><path d="m14 8-1-1"/><path d="m7 18 2.5 2.5"/><path d="m3.5 14.5.5.5"/><path d="m20 9 .5.5"/><path d="m6.5 12.5 1 1"/><path d="m16.5 10.5 1 1"/><path d="m10 16 1.5 1.5"/></svg></div>
                <h3>セレクトモード</h3>
                <p>実験ライブラリから行いたい実験を選んで挑戦します。<br>トロフィー獲得を目指そう。</p>
            </div>
        </div>
    </div>
</div>
