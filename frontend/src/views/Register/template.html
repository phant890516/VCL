<div class="register-container">
    <div class="register-card">
        <h2>VCL ログイン / 登録</h2>
        <div class="form-group">
            <label>ユーザー名</label>
            <input type="text" id="reg-username" placeholder="User Name">
        </div>
        <div class="form-group">
            <label>メールアドレス</label>
            <input type="email" id="reg-email" placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label>パスワード</label>
            <input type="password" id="reg-password" placeholder="Password">
        </div>
        <button id="btn-login" class="primary-btn login-btn">Login / Register</button>
        <div class="guest-link-container">
            <a href="#" id="link-guest">ゲストとして開始</a>
        </div>
    </div>
</div>
