<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCL - プロトタイプ（画面遷移あり）</title>
    <style>
        /* =========================================
           基本リセット & 共通
           ========================================= */
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; height: 100vh; overflow: hidden; }

        /* 3D描画領域（背景） */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fafafa;
            z-index: 0;
        }

        /* UIレイヤー（手前） */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: flex;
        }

        /* サイドバー */
        .sidebar {
            width: 250px;
            height: 100%;
            background-color: #fff;
            border-right: 1px solid #000;
            display: flex;
            flex-direction: column;
            padding: 10px;
            pointer-events: auto;
            flex-shrink: 0;
            overflow-y: auto; /* メニューが多い場合にスクロール */
        }

        /* コンテンツエリア */
        #main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            pointer-events: auto;
            position: relative;
            padding-bottom: 50px;
        }

        /* 実験カードのスタイル調整 */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .experiment-card {
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .card-image {
            height: 120px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #000;
            font-size: 0.8em;
        }
        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.9em;
            flex-grow: 1;
        }
        .card-content button {
            margin-top: auto;
        }
        .card-content h3 {
            margin: 0 0 5px 0;
            font-size: 1.1em;
            min-height: 2.4em; /* 2行分確保して揃える */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .difficulty-badge {
            align-self: flex-start;
            border: 1px solid #333;
            padding: 2px 6px;
            font-size: 0.8em;
            margin-bottom: 5px;
        }

        /* マイページ用 */
        .profile-header {
            border: 1px solid #000;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar-circle {
            width: 60px;
            height: 60px;
            border: 1px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        /* トロフィーリスト */
        .trophy-item {
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .trophy-icon { font-size: 2em; }

        /* 共通パーツ */
        .nav-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .nav-item { display: flex; align-items: center; padding: 10px; cursor: pointer; border: 1px solid transparent; margin-bottom: 5px; }
        .nav-item:hover, .nav-item.active { border: 1px solid #000; font-weight: bold; }
        .nav-icon { margin-right: 10px; width: 24px; text-align: center; }

        .logo-area { border-top: 1px solid #ccc; padding-top: 10px; margin-top: 20px; text-align: center; }
        .logo-title { font-weight: bold; font-size: 1.2em; }
        .logo-subtitle { font-size: 0.8em; }

        h2 { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 10px; }

        /* ボタン共通 */
        button {
            padding: 8px 15px;
            background: #fff;
            border: 1px solid #000;
            cursor: pointer;
        }
        button:hover { background: #eee; }

        /* =========================================
           シーン別スタイル
           ========================================= */

        /* 1. Register */
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .register-card {
            width: 400px;
            border: 1px solid #000;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .register-card input { padding: 8px; border: 1px solid #000; }

        /* 2. Dashboard */
        .experiment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .experiment-card {
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
        }
        .card-image {
            height: 150px;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #000;
        }
        .card-content { padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        /* 3. Lab */
        .lab-scene {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .canvas-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .lab-ui-controls {
            height: 80px;
            padding: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background: #fff;
        }
        .overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            border: 1px solid #000;
            padding: 10px;
        }
        .overlay-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        /* 4. Result */
        .result-scene { text-align: center; padding-top: 50px; }
        .score-box { border: 1px solid #000; display: inline-block; padding: 20px; margin: 20px; font-size: 2em; }

        /* ユーティリティ */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .gap-10 { gap: 10px; }
    </style>
</head>
<body>
    <!-- 1. 3D描画領域（背景） -->
    <div id="canvas-container">
        <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 1.5em;">

        </div>
    </div>

    <!-- 2. UIレイヤー（手前） -->
    <div id="ui-layer">
        <!-- サイドバー -->
        <nav id="sidebar" class="sidebar">
            <ul class="nav-list">
                <li class="nav-item active" onclick="router.navigate('dashboard')">
                    <span class="nav-icon">🏠</span><span class="nav-label">ホーム</span>
                </li>
                <li class="nav-item" onclick="router.navigate('select-mode')">
                    <span class="nav-icon">🧪</span><span class="nav-label">クエスト</span>
                </li>
                <li class="nav-item" onclick="router.navigate('idea')">
                    <span class="nav-icon">💡</span><span class="nav-label">ひらめき</span>
                </li>
                <li class="nav-item" onclick="router.navigate('live')">
                    <span class="nav-icon">📡</span><span class="nav-label">ライブ</span>
                </li>
                <li class="nav-item" onclick="router.navigate('trophy')">
                    <span class="nav-icon">🏆</span><span class="nav-label">トロフィー</span>
                </li>
                <li class="nav-item" onclick="router.navigate('setting')">
                    <span class="nav-icon">👤</span><span class="nav-label">設定</span>
                </li>
            </ul>
            <div class="logo-area">
                <div class="logo-title">VCL</div>
                <div class="logo-subtitle">VIRTUAL CHEMISTRY LAB</div>
            </div>
        </nav>

        <!-- メインコンテンツ表示エリア -->
        <main id="main-content"></main>
    </div>

    <!-- ========================================== -->
    <!-- TEMPLATES (各画面の中身) -->
    <!-- ========================================== -->

    <!-- 1. 新規登録/ログイン画面 -->
    <template id="tpl-register">
        <div class="register-container">
            <div class="register-card">
                <h2 style="text-align: center; border:none;">VCL 新規登録</h2>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>ユーザー名</label>
                    <input type="text" placeholder="User Name">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>メールアドレス</label>
                    <input type="email" placeholder="example@mail.com">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label>パスワード</label>
                    <input type="password" placeholder="Password">
                </div>
                <button onclick="router.navigate('dashboard')" style="margin-top: 10px; font-weight: bold;">アカウントを作成して開始</button>
                <div style="text-align: center; font-size: 0.9em;">
                    または <a href="#" onclick="router.navigate('dashboard'); return false;">ログイン</a>
                </div>
            </div>
        </div>
    </template>

    <!-- 2. ダッシュボード (ホーム) -->
    <template id="tpl-dashboard">
        <div style="padding: 20px; text-align: center;">
            <h1 style="margin-bottom: 5px; font-size: 2em;">実験室へようこそ</h1>
            <p style="margin-top: 0; margin-bottom: 40px; color: #666;">モードをセレクトしてください</p>

            <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                <!-- Card 1: Tutorial -->
                <div class="mode-card" style="border: 1px solid #000; padding: 30px; width: 300px; display: flex; flex-direction: column; align-items: center; border-radius: 10px; cursor: pointer; transition: background 0.2s;" onclick="router.navigate('lab', { id: 'tutorial', title: 'チュートリアル' })" onmouseover="this.style.backgroundColor='#f0f0f0'" onmouseout="this.style.backgroundColor='transparent'">
                    <div style="font-size: 5em; margin-bottom: 20px;">⚗️</div>
                    <h3 style="margin-bottom: 10px;">チュートリアルモード</h3>
                    <p style="font-size: 0.9em; text-align: center; line-height: 1.5;">VCLのチュートリアル機能です。<br>初めはここからスタートして、<br>トロフィーを獲得しましょう。</p>
                </div>

                <!-- Card 2: Select Mode -->
                <div class="mode-card" style="border: 1px solid #000; padding: 30px; width: 300px; display: flex; flex-direction: column; align-items: center; border-radius: 10px; cursor: pointer; transition: background 0.2s;" onclick="router.navigate('select-mode')" onmouseover="this.style.backgroundColor='#f0f0f0'" onmouseout="this.style.backgroundColor='transparent'">
                    <div style="font-size: 5em; margin-bottom: 20px;">🧬</div>
                    <h3 style="margin-bottom: 10px;">セレクトモード</h3>
                    <p style="font-size: 0.9em; text-align: center; line-height: 1.5;">実験を選べる機能です。<br>やりたい実験を自由に選択し、<br>トロフィーを獲得しましょう。</p>
                </div>

                <!-- Card 3: Free Mode -->
                <div class="mode-card" style="border: 1px solid #000; padding: 30px; width: 300px; display: flex; flex-direction: column; align-items: center; border-radius: 10px; cursor: pointer; transition: background 0.2s;" onclick="router.navigate('free-mode')" onmouseover="this.style.backgroundColor='#f0f0f0'" onmouseout="this.style.backgroundColor='transparent'">
                    <div style="font-size: 5em; margin-bottom: 20px;">🧪</div>
                    <h3 style="margin-bottom: 10px;">フリーモード</h3>
                    <p style="font-size: 0.9em; text-align: center; line-height: 1.5;">色々な組み合わせで実験できる機能です。<br>使いたいアイテムを自由に選択し、<br>トロフィーを獲得しましょう。</p>
                </div>
            </div>
        </div>
    </template>

    <!-- 3. セレクトモード (実験一覧) -->
    <template id="tpl-select-mode">
        <h2>セレクトモード - 実験ライブラリ</h2>
        <p>行いたい実験を選択してください。</p>
        <div id="experiment-list-container" class="experiment-grid">
            <!-- JSで動的に生成されます -->
        </div>
    </template>

    <!-- 4. ひらめき -->
    <template id="tpl-idea">
        <h2 style="border-bottom:none;">ひらめき・発見</h2>
        <p style="margin-bottom: 30px; color:#666;">自由に物質を組み合わせて、新しい反応を発見したり、アイデアを記録したりする場所です。</p>

        <div style="display:flex; gap:30px; height: 100%;">
            <!-- 左側: メインアクション -->
            <div style="flex: 2; display:flex; flex-direction:column; gap:20px;">
                <div style="border:1px solid #000; padding:40px; text-align:center; border-radius:10px; cursor:pointer;" onclick="router.navigate('free-mode')">
                    <div style="font-size:4em; margin-bottom:10px;">⚡</div>
                    <h3>フリーモード実験を開始</h3>
                    <p>直感を信じて、まだ見ぬ反応を探しに行こう</p>
                </div>

                <!-- 発見図鑑簡易版 -->
                <div style="border:1px solid #000; border-radius:10px; padding:20px; flex-grow:1;">
                    <h3>🧪 発見した反応図鑑 (Discovery Log)</h3>
                    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:10px; margin-top:20px;">
                        <div style="border:1px dashed #999; padding:10px; text-align:center; background:#eee;">💀 爆発<br><small>H2 + O2</small></div>
                        <div style="border:1px dashed #999; padding:10px; text-align:center;">? ? ?</div>
                        <div style="border:1px dashed #999; padding:10px; text-align:center;">? ? ?</div>
                        <div style="border:1px dashed #999; padding:10px; text-align:center;">? ? ?</div>
                        <div style="border:1px dashed #999; padding:10px; text-align:center;">? ? ?</div>
                        <div style="border:1px dashed #999; padding:10px; text-align:center;">? ? ?</div>
                    </div>
                </div>
            </div>

            <!-- 右側: メモ帳 -->
            <div style="flex: 1; border:1px solid #000; border-radius:10px; padding:20px; display:flex; flex-direction:column;">
                <h3>📝 アイデアノート</h3>
                <p style="font-size:0.8em; color:#666;">思いついた実験プランを書き留めておきましょう。</p>
                <textarea style="width:100%; flex-grow:1; margin-top:10px; padding:10px; border:1px solid #ccc; resize:none;" placeholder="例: 酸化銅に炭素を混ぜて加熱したらどうなるだろう？"></textarea>
                <button style="margin-top:10px;" onclick="alert('保存しました')">メモを保存</button>
            </div>
        </div>
    </template>

    <!-- 5. ライブ (アクティビティモード) -->
    <template id="tpl-live">
        <h2 style="border-bottom:none;">ライブ・セッション</h2>
        <p style="margin-bottom: 30px; color:#666;">先生や他の生徒と同じバーチャル空間で実験を行うことができます。</p>

        <div style="display: flex; gap: 30px; height: 100%;">

            <!-- メイン: 参加パネル -->
            <div style="flex: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #ccc; border-radius: 12px; padding: 40px; background: #fff;">
                <div style="margin-bottom: 30px; font-size: 4em;">📡</div>
                <h3 style="margin-top: 0; font-size: 1.5em; text-align: center;">実験ルームに参加</h3>
                <p style="color: #666; text-align: center; margin-bottom: 30px;">先生から伝えられた4桁のルームIDを入力してください。</p>

                <div style="display: flex; gap: 10px; width: 100%; max-width: 400px;">
                    <input type="text" placeholder="Room ID" style="flex-grow: 1; padding: 15px; font-size: 1.2em; text-align: center; letter-spacing: 5px; border: 2px solid #000; border-radius: 8px;">
                    <button style="padding: 0 30px; background: #000; color: #fff; border: 1px solid #000; border-radius: 8px; font-weight: bold;" onclick="alert('接続中...')">参加</button>
                </div>

                <div style="margin-top: 20px; font-size: 0.9em; color: green;">
                    ● サーバー接続良好 (ping: 12ms)
                </div>
            </div>

            <!-- サイド: 教師用 / 履歴 -->
            <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">

                <!-- 教師用クイックアクション -->
                <div style="border: 1px solid #000; border-radius: 12px; padding: 20px; background: #fdfdfd;">
                    <h3 style="margin-top: 0;">👨‍🏫 先生用メニュー</h3>
                    <p style="font-size: 0.8em; color: #666;">新しい授業用のルームを作成します。</p>
                    <button style="width: 100%; margin-top: 10px; padding: 10px;" onclick="alert('ルーム作成画面へ')">新規ルームを作成</button>
                </div>

                <!-- 履歴のようなもの -->
                <div style="flex-grow: 1; border: 1px solid #ccc; border-radius: 12px; padding: 20px; background: #fafafa;">
                    <h3 style="margin-top: 0; font-size: 1em; color: #666;">最近参加したルーム</h3>
                    <ul style="list-style: none; padding: 0; margin-top: 10px;">
                        <li style="padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.9em;">
                            <span>理科 第2分野・A組</span>
                            <span style="color: #999;">昨日</span>
                        </li>
                        <li style="padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.9em;">
                            <span>放課後補習</span>
                            <span style="color: #999;">3日前</span>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </template>

    <!-- フリーモード -->
    <template id="tpl-free-mode">
        <h2>フリーモード</h2>
        <p>使用する器具と試薬を選んで自由に実験できます。</p>
        <div class="lab-scene" style="height: 400px; justify-content:center; align-items:center; border:1px dashed #999;">
            <p>フリーモード用 実験サンドボックス (TBD)</p>
            <button onclick="router.navigate('lab', { title: 'フリー実験' })">実験スペースへ移動</button>
        </div>
    </template>

    <!-- 6. 実験画面 (Lab) -->
    <template id="tpl-lab">
        <div class="lab-scene">
            <div class="canvas-area">
                <div class="overlay-info">
                    <strong>実験中: <span id="lab-title"></span></strong>
                    <div>経過時間: <span id="timer">00:00</span></div>
                </div>

                <div class="overlay-actions">
                    <button onclick="if(confirm('中断してホームに戻りますか？')) router.navigate('dashboard')">中断</button>
                    <button onclick="router.navigate('result')">実験終了</button>
                </div>

                <div style="text-align:center; color:#666;">
                    [ 3D WebGL Canvas Area ]<br>
                    マウス操作で視点移動
                </div>
            </div>

            <div class="lab-ui-controls">
                <button onclick="console.log('Tool 1')">ビーカー</button>
                <button onclick="console.log('Tool 2')">フラスコ</button>
                <button onclick="console.log('Tool 3')">スポイト</button>
                <button onclick="console.log('Tool 4')">バーナー</button>
                <button onclick="console.log('Note')">実験ノート</button>
            </div>
        </div>
    </template>

    <!-- 7. 結果画面 -->
    <template id="tpl-result">
        <div class="result-scene">
            <h2>実験結果</h2>
            <p>お疲れ様でした！実験データは正常に保存されました。</p>

            <div class="score-box">
                評価: S
            </div>

            <div>
                <button onclick="router.navigate('lab', { id: 'retry' })">もう一度</button>
                <button onclick="router.navigate('dashboard')">ホームに戻る</button>
            </div>
        </div>
    </template>

    <!-- 8. トロフィー画面 -->
    <template id="tpl-trophy">
        <h2>🏆 トロフィー・実績</h2>
        <div class="trophy-item">
            <span class="trophy-icon">🥇</span>
            <div>
                <strong>はじめの一歩</strong><br>
                <small>条件: 初回ログインを完了した</small><br>
                <span style="color:green;">[獲得済] 2026/01/29</span>
            </div>
        </div>
        <div class="trophy-item">
            <span class="trophy-icon">🥈</span>
            <div>
                <strong>実験の基礎</strong><br>
                <small>条件: チュートリアルを最後まで完了した</small><br>
                <span style="color:#999;">[未獲得]</span>
            </div>
        </div>
        <div class="trophy-item">
             <span class="trophy-icon">🧪</span>
             <div>
                 <strong>実験マスター</strong><br>
                 <small>条件: セレクトモード内の実験を全て成功させた</small><br>
                 <span style="color:#999;">[未獲得]</span>
             </div>
        </div>
    </template>

    <!-- 9. 設定 (マイページ) -->
    <template id="tpl-setting">
        <div style="width: 100%;">
            <h2 style="border: none; margin-bottom: 20px;">設定 / マイページ</h2>

            <!-- プロフィールカード -->
            <div style="background: #fff; border: 1px solid #ccc; border-radius: 12px; padding: 30px; display: flex; align-items: center; gap: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 30px;">
                <div style="width: 80px; height: 80px; background: #e0e0e0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3em;">👤</div>
                <div style="flex-grow: 1;">
                    <h3 style="margin: 0; font-size: 1.5em;">VCL User 01</h3>
                    <p style="margin: 5px 0 0; color: #666;">ID: user_12345678 | Role: 生徒</p>
                </div>
                <button onclick="alert('プロフィール編集')" style="padding: 10px 20px; border-radius: 20px;">プロフィール編集</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">

                <!-- アプリ設定 -->
                <div style="background: #fff; border: 1px solid #ccc; border-radius: 12px; padding: 20px;">
                    <h3 style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">⚙️ アプリケーション設定</h3>

                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f5f5f5;">
                        <span>ダークモード</span>
                        <div style="width: 40px; height: 20px; background: #ccc; border-radius: 10px; position: relative; cursor: pointer;" onclick="this.style.background = this.style.background === 'rgb(204, 204, 204)' ? '#4CAF50' : '#ccc'">
                            <div style="width: 16px; height: 16px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px;"></div>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f5f5f5;">
                        <span>BGM / 効果音</span>
                        <div style="width: 40px; height: 20px; background: #4CAF50; border-radius: 10px; position: relative; cursor: pointer;" onclick="this.style.background = this.style.background === 'rgb(76, 175, 80)' ? '#ccc' : '#4CAF50'">
                            <div style="width: 16px; height: 16px; background: #fff; border-radius: 50%; position: absolute; top: 2px; right: 2px;"></div>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0;">
                        <span>通知設定</span>
                         <span style="color: #666; font-size: 0.9em; cursor: pointer;">すべてON ></span>
                    </div>
                </div>

                <!-- アカウントセキュリティ -->
                <div style="background: #fff; border: 1px solid #ccc; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
                    <h3 style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">🔒 セキュリティ</h3>

                    <button style="text-align: left; padding: 12px; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9;" onclick="alert('PW変更')">
                        🔑 パスワードの変更
                    </button>
                    <button style="text-align: left; padding: 12px; border: 1px solid #eee; border-radius: 8px; background: #f9f9f9;" onclick="alert('メールアドレス変更')">
                        📧 メールアドレスの変更
                    </button>

                    <div style="margin-top: auto; padding-top: 20px;">
                        <button style="width: 100%; border: 1px solid #000; background: #333; color: #fff; padding: 12px; border-radius: 8px;" onclick="router.navigate('register')">
                            🚪 ログアウト
                        </button>
                    </div>
                </div>

            </div>

            <!-- Danger Zone -->
            <div style="margin-top: 30px; border: 1px solid #ffcccc; background: #fff5f5; border-radius: 12px; padding: 20px;">
                <h3 style="margin-top: 0; color: #d32f2f;">🚫 デンジャーゾーン</h3>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <p style="margin: 0; font-size: 0.9em; color: #d32f2f;">アカウントを完全に削除します。この操作は取り消せません。</p>
                    <button style="background: #d32f2f; color: #fff; border: none; padding: 8px 15px; border-radius: 5px;" onclick="if(confirm('本当に削除しますか？')) alert('削除しました')">アカウント削除</button>
                </div>
            </div>
        </div>
    </template>

    <!-- SCRIPT (ルーターロジック & データ) -->
    <!-- ========================================== -->
    <script>
        // 実験データ (要件定義書 6.0 より)
        const experimentsData = [
            { id: 'exp_01_o2', title: '酸素の発生実験', desc: '二酸化マンガンに過酸化水素水を注ぎ、激しく泡が出る様子を観察する。', materials: '二酸化マンガン, 過酸化水素水' },
            { id: 'exp_02_co2', title: '二酸化炭素の発生実験', desc: '石灰石に塩酸を注ぎ、白く濁る様子や温度変化を観察する。', materials: '塩酸, 石灰石' },
            { id: 'exp_03_al', title: '金属の溶け方（アルミニウム）', desc: 'アルミニウムに塩酸を注ぎ、発熱と水素発生を観察する。', materials: 'アルミニウム, 塩酸' },
            { id: 'exp_04_salt', title: '食塩水の蒸発', desc: '食塩水を蒸発皿で加熱し、白い結晶（塩化ナトリウム）を取り出す。', materials: '食塩水' },
            { id: 'exp_05_nahco3', title: '炭酸水素ナトリウムの加熱', desc: '熱分解により炭酸ナトリウム、水、二酸化炭素が発生する様子を確認。', materials: '炭酸水素ナトリウム' },
            { id: 'exp_06_neutral', title: '酸とアルカリの性質調べ', desc: '水酸化ナトリウムと塩酸の中和反応をフェノールフタレインで確認。', materials: 'NaOH, HCl' },
            { id: 'exp_07_lime', title: '石灰水と二酸化炭素の反応', desc: '二酸化炭素に石灰水を入れて白く濁る（炭酸カルシウム生成）様子を見る。', materials: '石灰水, CO2' },
            { id: 'exp_08_mg', title: 'マグネシウムの燃焼', desc: 'マグネシウムを燃焼させ、激しい光と酸化マグネシウムの生成を観察。', materials: 'Mg, O2' },
            { id: 'exp_09_ag', title: '硝酸銀水溶液の反応', desc: '硝酸銀と塩化ナトリウムを混ぜ、塩化銀の白い沈殿を生成する。', materials: '硝酸銀, NaCl' },
            { id: 'exp_10_cu', title: '酸化銅の還元', desc: '酸化銅と炭素を加熱し、銅が還元される様子を観察する。', materials: '酸化銅, 炭素' },
            { id: 'exp_11_fe_s', title: '鉄と硫黄の反応', desc: '鉄と硫黄を加熱して硫化鉄を生成。硫化鉄の生成を確認する。', materials: '鉄, 硫黄' },
        ];

        const router = {
            mainContent: document.getElementById('main-content'),
            sidebar: document.getElementById('sidebar'),

            // 画面遷移関数
            navigate: function(sceneName, params = {}) {
                console.log(`Navigating to: ${sceneName}`, params);

                // テンプレートを取得してクローン
                const templateId = `tpl-${sceneName}`;
                const template = document.getElementById(templateId);

                if (template) {
                    // コンテンツをクリア
                    this.mainContent.innerHTML = '';

                    const clone = document.importNode(template.content, true);

                    // Labシーンなどの場合、動的に値を埋め込む
                    if (sceneName === 'lab') {
                        const titleEl = clone.getElementById('lab-title');
                        const title = params.title || '実験';
                        if (titleEl) titleEl.textContent = title;

                        // 簡易タイマー
                        let sec = 0;
                        const timerEl = clone.getElementById('timer');
                        if(timerEl) {
                            setInterval(() => {
                                sec++;
                                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                                const s = (sec % 60).toString().padStart(2, '0');
                                timerEl.textContent = `${m}:${s}`;
                            }, 1000);
                        }
                    }

                    // セレクトモードの場合、実験リストを生成
                    if (sceneName === 'select-mode') {
                        // clone後の要素から取得する必要があるが、appendChild前なので
                        // 一旦appendChildしてからquerySelectorするか、cloneに対してquerySelectorする
                        // ここではappendChild後に処理します
                    }

                    this.mainContent.appendChild(clone);

                    // セレクトモードのリスト生成 (DOM追加後)
                    if (sceneName === 'select-mode') {
                        const listContainer = document.getElementById('experiment-list-container');
                        if (listContainer) {
                            experimentsData.forEach(exp => {
                                const card = document.createElement('div');
                                card.className = 'experiment-card';
                                card.innerHTML = `
                                    <div class="card-image">${exp.title}</div>
                                    <div class="card-content">
                                        <h3>${exp.title}</h3>
                                        <div class="difficulty-badge">使用物質: ${exp.materials}</div>
                                        <p>${exp.desc}</p>
                                        <button onclick="router.navigate('lab', { title: '${exp.title}', id: '${exp.id}' })">実験開始</button>
                                    </div>
                                `;
                                listContainer.appendChild(card);
                            });
                        }
                    }

                } else {
                    this.mainContent.innerHTML = `<p>Error: Scene template '${sceneName}' (ID: ${templateId}) not found.</p>`;
                }

                // ナビゲーションのハイライト更新
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

                // 対応するナビゲーション項目をハイライト
                // onclick属性の文字列をチェックして簡易判定
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach(item => {
                    if (item.getAttribute('onclick').includes(`'${sceneName}'`)) {
                        item.classList.add('active');
                    }
                });
            }
        };

        // 初期表示
        document.addEventListener('DOMContentLoaded', () => {
            router.navigate('register');
        });
    </script>
</body>
</html>
