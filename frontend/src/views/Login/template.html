<div class="login-wrapper">
    <!-- 左側：ビジュアルエリア -->
    <div class="login-visual">
        <div class="visual-content">
            <h1 class="visual-title">VCL</h1>
            <p class="visual-subtitle">Virtual Chemistry Lab</p>
            <p class="visual-description">
                安全なバーチャル空間で、<br>
                思いっきり実験しよう。
            </p>
            <div class="visual-decoration">
                <div class="circle circle-1"></div>
                <div class="circle circle-2"></div>
                <div class="circle circle-3"></div>
            </div>
        </div>
    </div>

    <!-- 右側：フォームエリア -->
    <div class="login-form-section">
        <div class="login-card-modern">
            <div class="form-header">
                <h2>おかえりなさい！</h2>
                <p>実験を始めるにはログインしてください</p>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">メールアドレス</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" required placeholder="name@school.ed.jp">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">パスワード</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" required placeholder="パスワードを入力">
                    </div>
                </div>

                <div class="form-error" id="login-error"></div>

                <div class="form-actions">
                    <button type="submit" class="primary-btn login-btn">
                        ログインして始める 🚀
                    </button>
                </div>
            </form>

            <div class="form-footer">
                <p>初めてですか？ <a href="/register" data-link>アカウントを作成</a></p>
            </div>
        </div>
    </div>
</div>
