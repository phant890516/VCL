<div class="setting-container">
    <h2 class="setting-title">設定 / マイページ</h2>

    <!-- プロフィールカード -->
    <div class="profile-card">
        <div class="avatar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <div class="profile-info">
            <h3 class="profile-name">VCL User 01</h3>
            <p class="profile-meta">ID: user_12345678 | Role: 生徒</p>
        </div>
        <button class="secondary-btn profile-edit-btn">プロフィール編集</button>
    </div>

    <div class="setting-grid">
        <!-- アプリ設定 -->
        <div class="setting-section">
            <h3 class="section-title-app"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> アプリケーション設定</h3>

            <div class="setting-row">
                <span>ダークモード</span>
                <div class="status-on">ON</div>
            </div>

            <div class="setting-row">
                <span>BGM / 効果音</span>
                <div class="status-on">ON</div>
            </div>

            <div class="setting-row">
                <span>通知設定</span>
                <span class="status-link">すべてON ></span>
            </div>
        </div>

        <!-- アカウントセキュリティ -->
        <div class="setting-section security-section">
            <h3 class="section-title-security"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> セキュリティ</h3>

            <button class="secondary-btn security-btn icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="m21 2-2 2m-7.6 7.6a6.5 6.5 0 1 1-5.3-5.3 11.23 11.23 0 0 0 5.3 5.3Zm3.8-3.8 2.2 2.2a2 2 0 0 1 0 2.8l-1.9 1.9a2 2 0 0 1-2.8 0l-2.2-2.2"/></svg> パスワードの変更
            </button>
            <button class="secondary-btn security-btn icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg> メールアドレスの変更
            </button>

            <div class="logout-area">
                <button class="primary-btn logout-btn icon-btn" id="btn-logout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg> ログアウト
                </button>
            </div>
        </div>
    </div>

    <!-- Danger Zone -->
    <div class="setting-section danger-zone">
        <h3 class="danger-title"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg> デンジャーゾーン</h3>
        <div class="danger-content">
            <p class="danger-desc">アカウントを完全に削除します。この操作は取り消せません。</p>
            <button class="btn-danger" id="btn-delete-account">アカウント削除</button>
        </div>
    </div>
</div>
